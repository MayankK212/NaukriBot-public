name: JobBot Daily

# Runs entirely on GitHub's free cloud — no PC, no phone, no proxy needed.
# The ONE trick: Naukri (Akamai) blocks HEADLESS browsers, so we run REAL Google
# Chrome, headed, under Xvfb (a virtual display). That alone passes; GitHub's
# datacenter IP is fine with a real browser.
#
# Triggering: EXTERNAL PINGER ONLY. GitHub cron is best-effort (fires hours
# late) and Naukri blocks applies by then, so the schedule was REMOVED. The
# only trigger is the external cron-job.org pinger firing workflow_dispatch
# daily at 08:25 IST. If that ever stops, the bot goes silent — check
# cron-job.org (your repo → daily-jobbot.yml dispatch job).
"on":
  workflow_dispatch: {}

concurrency:
  group: jobbot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The apply phase self-stops after ~40 min (APPLY_TIME_BUDGET) so the email
    # always goes out; this is just the outer hard cap for slow/surprise days.
    timeout-minutes: 90

    env:
      HEADLESS: "false"           # real Chrome, headed under Xvfb (not detected)
      MONGO_URI: ${{ secrets.MONGO_URI }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-flash-latest   # free-tier flash alias; 2.x named models 404 for new keys
      # Resume <-> JD relevance gate (scraper). 0 disables matching entirely.
      JD_MIN_MATCHED_SKILLS: "3"          # keep if >=3 profile skills in the JD, or >=1 + role match
      JD_FETCH_DETAIL: "true"             # open each job page for the full JD (false = card snippet only)
      JD_MAX_FETCHES: "60"                # cap on detail-page fetches per run

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install real Google Chrome + Xvfb (headed, low-detection)
        run: |
          python -m playwright install --with-deps chrome
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Write Naukri cookies from secret
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: printf '%s' "$NAUKRI_COOKIES" > cookies.json

      - name: Write resume profile from secret (if provided)
        env:
          RESUME_JSON: ${{ secrets.RESUME_JSON }}
        run: |
          if [ -n "$RESUME_JSON" ]; then
            printf '%s' "$RESUME_JSON" > resume_data.json
            echo "resume_data.json written from RESUME_JSON secret."
          else
            echo "No RESUME_JSON secret; using committed resume_data.json if present."
          fi

      - name: Run daily pipeline (scrape -> apply -> email) under Xvfb
        run: xvfb-run -a python run_daily.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobbot-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
